
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arts Fest</title>
<!-- Premium Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html,
body {
    width: 100%;
    height: 100%;
}
body {
    background: #000;
    color: #fff;
    overflow: hidden;
    font-family: "Manrope", sans-serif;
}
/* Main Screen */
.screen {
    width: 100vw;
    height: 100vh;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
}
/* Subtle atmosphere */
.screen::before {
    content: "";
    position: absolute;
    width: 420px;
    height: 420px;
    background: radial-gradient(
        circle,
        rgba(255,255,255,0.035),
        transparent 70%
    );
    pointer-events: none;
}
/* Mystery Icon */
.mystery-icon {
    width: 82px;
    height: 82px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transform: scale(0.7);
    animation:
        iconReveal 1.8s
        cubic-bezier(.16,1,.3,1)
        forwards;
}
/* Outer Ring */
.mystery-icon::before {
    content: "";
    position: absolute;
    width: 72px;
    height: 72px;
    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 50%;
    animation:
        slowRotate 5s
        linear infinite;
}
/* Inner Ring */
.mystery-icon::after {
    content: "";
    position: absolute;
    width: 42px;
    height: 42px;
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 50%;
    animation:
        reverseRotate 3s
        linear infinite;
}
/* Center Symbol */
.symbol {
    width: 12px;
    height: 12px;
    background: #fff;
    transform: rotate(45deg);
    box-shadow:
        0 0 12px rgba(255,255,255,0.7),
        0 0 30px rgba(255,255,255,0.2);
    animation:
        pulse 2s
        ease-in-out infinite;
}
/* Loading Area */
.loading {
    margin-top: 45px;
    display: flex;
    align-items: center;
    gap: 18px;
    opacity: 0;
    transform: translateY(15px);
    animation:
        loadingReveal 1.2s
        ease 1.3s
        forwards;
}
/* Large Loading Spinner */
.spinner {
    width: 27px;
    height: 27px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.18);
    border-top-color: #fff;
    border-right-color: #fff;
    animation:
        spin 0.8s
        linear infinite;
}
/* Loading Text */
.loading-text {
    color: #fff;
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 4px;
}
/* Arts Fest */
.arts-fest {
    position: absolute;
    bottom: 58px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.9);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 3px;
    opacity: 0;
    animation:
        bottomReveal 1.2s
        ease 1.8s
        forwards;
}
/* Academy */
.academy {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.45);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 2px;
    white-space: nowrap;
    opacity: 0;
    animation:
        bottomReveal 1.2s
        ease 2.1s
        forwards;
}
/* Animations */
@keyframes iconReveal {
    0% {
        opacity: 0;
        transform:
            scale(0.7)
            rotate(-20deg);
        filter: blur(12px);
    }
    60% {
        opacity: 1;
        filter: blur(1px);
    }
    100% {
        opacity: 1;
        transform:
            scale(1)
            rotate(0deg);
        filter: blur(0);
    }
}
@keyframes slowRotate {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}
@keyframes reverseRotate {
    from {
        transform: rotate(360deg);
    }
    to {
        transform: rotate(0deg);
    }
}
@keyframes pulse {
    0%,
    100% {
        transform:
            rotate(45deg)
            scale(0.8);
        opacity: 0.7;
    }
    50% {
        transform:
            rotate(45deg)
            scale(1.25);
        opacity: 1;
    }
}
@keyframes loadingReveal {
    0% {
        opacity: 0;
        transform:
            translateY(15px);
    }
    100% {
        opacity: 1;
        transform:
            translateY(0);
    }
}
@keyframes bottomReveal {
    0% {
        opacity: 0;
        transform:
            translate(-50%, 10px);
    }
    100% {
        opacity: 1;
        transform:
            translate(-50%, 0);
    }
}
@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}
</style>
</head>
<body>
<div class="screen">
    <!-- Mystery / Surprise Icon -->
    <div class="mystery-icon">
        <div class="symbol"></div>
    </div>
    <!-- Loading -->
    <div class="loading">
        <div class="spinner"></div>
        <div class="loading-text">
            Loading...
        </div>
    </div>
    <!-- Arts Fest -->
    <div class="arts-fest">
        #ArtsFest
    </div>
    <!-- Academy -->
    <div class="academy">
        Markaz Sanaviyya Academy
    </div>
</div>
</body>
</html>
